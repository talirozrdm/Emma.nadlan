          brokerage_block = '''    <section class="quiet-band" aria-labelledby="brokerage-services-title">
      <h2 id="brokerage-services-title">שירותי תיווך נדל״ן באור עקיבא והסביבה</h2>
      <ul class="services brokerage-services" aria-label="שירותי התיווך של אמה נדל״ן">
