'''

          faq_block = '''    <section class="quiet-band faq-section" aria-labelledby="faq-title">
      <h2 id="faq-title">שאלות נפוצות על תיווך נדל״ן באור עקיבא</h2>
      <div class="faq-list">
        <article class="faq-item">
          <h3>איך בוחרים מתווך באור עקיבא?</h3>
          <p>כדאי לבחור איש מקצוע שמכיר את הרחובות, הביקושים והעסקאות באזור, מסביר את התהליך בצורה ברורה ושומר על שקיפות. אמה נדל״ן מתמקדת בתיווך נדל״ן באור עקיבא, אור ים והסביבה, ולכן יכולה לתת תמונה מקומית ומעשית.</p>
        </article>
        <article class="faq-item">
          <h3>מה חשוב לבדוק לפני שבוחרים מתווך למכירת דירה?</h3>
          <p>לפני מכירת דירה באור עקיבא חשוב לבדוק ניסיון מקומי, תכנית שיווק, דרך סינון קונים ורמת זמינות. מומלץ להבין מראש איך הנכס יוצג, באילו ערוצים יפורסם ואיך ינוהל התהליך.</p>
        </article>
        <article class="faq-item">
          <h3>למה חשוב לעבוד עם מתווך שמכיר את אור עקיבא והשכונות באזור?</h3>
          <p>מתווך באור עקיבא שמכיר את השכונות, אור ים והסביבה יכול להבין טוב יותר את הביקושים, את סוגי הקונים ואת הדרך הנכונה להציג כל נכס.</p>
        </article>
        <article class="faq-item">
          <h3>איך מתווך יכול לעזור בתמחור נכון של נכס?</h3>
          <p>תמחור נכון נשען על מצב הנכס, עסקאות דומות, ביקושים ותחרות באזור. אמה נדל״ן בודקת את הנתונים המקומיים כדי לעזור למוכר להתחיל את התהליך בצורה מסודרת.</p>
        </article>
        <article class="faq-item">
          <h3>מה ההבדל בין פרסום דירה לבד לבין עבודה עם מתווך?</h3>
          <p>פרסום לבד מציג את הדירה לקהל רחב, אבל לא תמיד מסנן פניות או מנהל את התהליך. בעבודה עם מתווך יש ליווי, שיווק נכס, סינון קונים, תיאומי סיורים וניהול משא ומתן.</p>
        </article>
        <article class="faq-item">
          <h3>באילו אזורים אמה נדל״ן פועלת?</h3>
          <p>אמה נדל״ן פועלת בעיקר באור עקיבא, אור ים והסביבה, ומלווה מוכרים וקונים בתהליכי מכירה, קנייה ושיווק נכסים באזור.</p>
        </article>
      </div>
    </section>

'''

          hero_subtitle_css = '''    .hero-subtitle {
      max-width: 760px;
      margin: -6px 0 18px;
      color: #2d2924;
      font-size: clamp(1rem, 3.2vw, 1.18rem);
      line-height: 1.55;
      font-weight: 800;
    }

'''

          faq_css = '''    .faq-list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .faq-item {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 12px 34px rgba(22, 20, 16, 0.045);
    }

    .faq-item h3 {
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 1.04rem;
    }

    .faq-item p {
      margin-bottom: 0;
      color: #474139;
      font-size: 0.96rem;
      line-height: 1.68;
    }

'''

          index = index.replace('<title>אמה נדל״ן | מכירת נכסים באור עקיבא והסביבה</title>', '<title>אמה נדל״ן | תיווך נדל״ן באור עקיבא והסביבה</title>')
          index = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="מחפשים מתווך באור עקיבא? אמה נדל״ן מספקת שירותי תיווך נדל״ן באור עקיבא, אור ים והסביבה, כולל ליווי מוכרים וקונים, תמחור נכון, שיווק נכסים וסינון קונים רציניים.">', index, count=1)
          index = re.sub(r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="אמה נדל״ן | תיווך נדל״ן באור עקיבא והסביבה">', index, count=1)
          index = re.sub(r'<meta property="og:description" content="[^"]*">', '<meta property="og:description" content="שירותי תיווך נדל״ן באור עקיבא, אור ים והסביבה, כולל ליווי מוכרים וקונים, תמחור נכון, שיווק נכסים וסינון קונים רציניים.">', index, count=1)
          index = re.sub(r'<meta name="twitter:title" content="[^"]*">', '<meta name="twitter:title" content="אמה נדל״ן | תיווך נדל״ן באור עקיבא והסביבה">', index, count=1)
          index = re.sub(r'<meta name="twitter:description" content="[^"]*">', '<meta name="twitter:description" content="מחפשים מתווך באור עקיבא? אמה נדל״ן מלווה מוכרים וקונים באור עקיבא, אור ים והסביבה.">', index, count=1)
          index = re.sub(r'  <script type="application/ld\+json">[\s\S]*?  </script>', new_schema, index, count=1)
          index = index.replace('<h1 id="hero-title">מוכרים נכס באור עקיבא והסביבה?<br>אל תתחילו לפני שיש לכם תכנית מכירה נכונה</h1>', '<h1 id="hero-title">מוכרים נכס באור עקיבא והסביבה?</h1>\n        <p class="hero-subtitle">מחפשים מתווך באור עקיבא? אמה נדל״ן מלווה מוכרים וקונים בתהליך מקצועי, אישי ומסודר.</p>')
          if 'brokerage-services-title' not in index:
              index = index.replace('    <section class="quiet-band" aria-labelledby="method-title">', brokerage_block + '    <section class="quiet-band" aria-labelledby="method-title">', 1)
          index = index.replace('<span class="gold-text">שיווק מדויק</span> ו<span class="gold-text">ליווי אישי</span>', '<span class="gold-text">שיווק מדויק</span> <span class="gold-text">וליווי אישי</span>')
          index = index.replace('שיווק ו<span class="gold-text">סינון קונים</span>', 'שיווק <span class="gold-text">וסינון קונים</span>')
          if 'faq-title' not in index:
              index = index.replace('    <section class="legal" aria-label="מידע משפטי ונגישות">', faq_block + '    <section class="legal" aria-label="מידע משפטי ונגישות">', 1)

          if '.hero-subtitle' not in style:
              style = style.replace('    h2 {\n', hero_subtitle_css + '    h2 {\n', 1)
          if '.faq-list' not in style:
              style = style.replace('    .proof-card {\n', faq_css + '    .proof-card {\n', 1)
          if 'html.a11y-high-contrast .buyer-card,' in style and 'html.a11y-high-contrast .faq-item,' not in style:
              style = style.replace('    html.a11y-high-contrast .buyer-card,\n', '    html.a11y-high-contrast .buyer-card,\n    html.a11y-high-contrast .faq-item,\n', 1)
          if 'html.a11y-high-contrast .hero-subtitle,' not in style:
              style = style.replace('    html.a11y-high-contrast .section-intro,\n', '    html.a11y-high-contrast .section-intro,\n    html.a11y-high-contrast .hero-subtitle,\n', 1)
          if 'html.a11y-high-contrast .faq-item p,' not in style:
              style = style.replace('    html.a11y-high-contrast .buyer-card p,\n', '    html.a11y-high-contrast .buyer-card p,\n    html.a11y-high-contrast .faq-item p,\n', 1)
          if '.faq-list {\n        grid-template-columns: repeat(2, minmax(0, 1fr));' not in style:
              style = style.replace('      .buyer-cards {\n        grid-template-columns: repeat(3, minmax(0, 1fr));\n      }\n\n', '      .buyer-cards {\n        grid-template-columns: repeat(3, minmax(0, 1fr));\n      }\n\n      .faq-list {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n      }\n\n', 1)

          index_path.write_text(index, encoding='utf-8')
          style_path.write_text(style, encoding='utf-8')
          workflow_path.unlink(missing_ok=True)
          PY
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css .github/workflows/apply-emma-seo-20260702.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Emma Nadlan SEO content"
            git push
          fi
